<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AlphaTest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * {
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            background-attachment: fixed;
            position: relative;
        }

        /* Technical grid overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 0 rgba(255, 255, 255, 0.15);
        }

        .input-glass {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }

        .input-glass:focus {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.4);
            outline: none;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .input-glass::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="content-wrapper max-w-md w-full">
        <!-- Sign Up Card -->
        <div class="glass rounded-3xl p-8">
            <div class="text-center mb-8">
                <!-- Logo -->
                <div class="flex justify-center mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-green-400">
                        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
                        <path d="M3 6h18"/>
                        <path d="M16 10a4 4 0 0 1-8 0"/>
                    </svg>
                </div>
                <h1 class="text-3xl font-black text-white mb-2">Create Your Account</h1>
                <p class="text-white/60">Start testing with AI-powered UAT</p>
            </div>

            <!-- Sign Up Form -->
            <form id="signupForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-white/90 mb-2 flex items-center">
                        <i data-lucide="user" class="w-4 h-4 mr-2 text-green-400"></i>
                        Name (optional)
                    </label>
                    <input
                        type="text"
                        id="name"
                        placeholder="John Doe"
                        class="w-full px-4 py-3 input-glass rounded-xl text-sm transition"
                    >
                </div>

                <div>
                    <label class="block text-sm font-semibold text-white/90 mb-2 flex items-center">
                        <i data-lucide="mail" class="w-4 h-4 mr-2 text-green-400"></i>
                        Email
                    </label>
                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                        class="w-full px-4 py-3 input-glass rounded-xl text-sm transition"
                    >
                </div>

                <div>
                    <label class="block text-sm font-semibold text-white/90 mb-2 flex items-center">
                        <i data-lucide="lock" class="w-4 h-4 mr-2 text-green-400"></i>
                        Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        placeholder="At least 8 characters"
                        required
                        class="w-full px-4 py-3 input-glass rounded-xl text-sm transition"
                    >
                    <p class="text-xs text-white/50 mt-2 flex items-center">
                        <i data-lucide="info" class="w-3 h-3 mr-1"></i>
                        Must be at least 8 characters long
                    </p>
                </div>

                <div id="errorMsg" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-xl text-sm"></div>

                <button
                    type="submit"
                    id="submitBtn"
                    class="w-full py-4 bg-green-600 text-white font-bold rounded-xl hover:bg-green-700 transition transform hover:scale-105"
                >
                    Create Account
                </button>

                <!-- Terms -->
                <p class="text-xs text-white/50 text-center">
                    By signing up, you agree to our Terms of Service and Privacy Policy
                </p>
            </form>

            <!-- Divider -->
            <div class="mt-6">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-white/10"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-3 bg-[rgba(15,23,42,0.6)] text-white/60">Already have an account?</span>
                    </div>
                </div>
            </div>

            <!-- Login Link -->
            <div class="mt-6">
                <a href="/login" class="block w-full py-3 text-center border border-white/20 text-white font-semibold rounded-xl hover:bg-white/5 transition">
                    Sign In
                </a>
            </div>

            <!-- Back to Home -->
            <div class="mt-4">
                <a href="/" class="block text-center text-sm text-white/60 hover:text-white/90 transition">
                    ← Back to Home
                </a>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6">
            <p class="text-white/60 text-sm">
                AI-powered UAT testing for modern applications
            </p>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');

            // Get form data
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Validate password length
            if (password.length < 8) {
                errorMsg.textContent = 'Password must be at least 8 characters long';
                errorMsg.classList.remove('hidden');
                return;
            }

            // Hide previous errors
            errorMsg.classList.add('hidden');

            // Disable button
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin inline"></i> Creating account...';
            lucide.createIcons();

            try {
                const response = await fetch('/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (data.success) {
                    btn.innerHTML = '<i data-lucide="check" class="w-5 h-5 inline mr-2"></i> Success! Redirecting...';
                    lucide.createIcons();
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 500);
                } else {
                    errorMsg.textContent = data.error || 'Failed to create account';
                    errorMsg.classList.remove('hidden');
                    btn.disabled = false;
                    btn.textContent = 'Create Account';
                }
            } catch (error) {
                errorMsg.textContent = 'Network error. Please try again.';
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        });
    </script>
</body>
</html>

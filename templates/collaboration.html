<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaboration Dashboard - AlphaTest</title>
    <link rel="icon" type="image/svg+xml" href="/static/images/alphatest-logo.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f172a;
        }
        #collaboration-root {
            min-height: 100vh;
        }
        /* Loading state */
        .loading {
            display: flex;
            align-items: center;
            justify-center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(16, 185, 129, 0.3);
            border-top-color: #10b981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="collaboration-root">
        <div class="loading">
            <div class="loading-spinner"></div>
        </div>
    </div>

    <!-- React App Bundle -->
    <script src="/static/dist/collaboration-bundle.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Project - AlphaTest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/theme.css">
</head>
<body>
    <!-- Background Pattern -->
    <div class="bg-pattern"></div>

    <!-- Content Wrapper -->
    <div class="relative z-10 min-h-screen">
        <!-- Header -->
        <header class="header-glass">
            <div class="container mx-auto px-6 py-5">
                <div class="flex items-center space-x-4">
                    <a href="/" class="btn-ghost text-sm">← Back</a>
                    <div class="w-px h-6 bg-white/20"></div>
                    <h1 class="text-xl font-bold text-white">New Project</h1>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="container mx-auto px-6 py-8">
            <div class="max-w-xl mx-auto">
                <div class="glass-card p-8">
                    <!-- Header -->
                    <div class="text-center mb-8">
                        <div class="icon-container-lg mx-auto mb-4">
                            
                        </div>
                        <h2 class="text-2xl font-bold text-white mb-2">Add a New Project</h2>
                        <p class="text-slate-400">Enter your app details to start testing</p>
                    </div>

                    <!-- Form -->
                    <form id="projectForm" class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Project Name</label>
                            <input type="text" id="name" placeholder="My Web App" required
                                class="input-glass">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">App URL</label>
                            <input type="url" id="url" placeholder="https://app.example.com" required
                                class="input-glass">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">
                                Login URL <span class="text-slate-500">(optional)</span>
                            </label>
                            <input type="url" id="login_url" placeholder="https://app.example.com/login"
                                class="input-glass">
                            <p class="text-xs text-slate-500 mt-2">Leave blank if same as app URL</p>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-2">Test Email</label>
                                <input type="email" id="email" placeholder="tester@example.com"
                                    class="input-glass">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-2">Test Password</label>
                                <input type="password" id="password" placeholder="••••••••"
                                    class="input-glass">
                            </div>
                        </div>

                        <!-- Info Box -->
                        <div class="glass-subtle p-4 flex items-start space-x-3">
                            <span class="text-blue-400 text-lg">💡</span>
                            <p class="text-sm text-slate-300">
                                Use a dedicated test account, not your admin credentials. This keeps your main account safe.
                            </p>
                        </div>

                        <button type="submit" id="submitBtn" class="btn-primary w-full py-4">
                            Create Project
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('projectForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="flex items-center justify-center space-x-2"><span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span><span>Creating...</span></span>';

            const data = {
                name: document.getElementById('name').value,
                url: document.getElementById('url').value,
                login_url: document.getElementById('login_url').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const resp = await fetch('/project/new', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await resp.json();
                if (result.success) {
                    window.location.href = '/project/' + result.project_id;
                } else {
                    alert('Error creating project');
                }
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Create Project';
            }
        });
    </script>
</body>
</html>
